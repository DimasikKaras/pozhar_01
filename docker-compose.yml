services:
  db:
    image: postgres:16-alpine
    container_name: pozhnadzor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pozhnadzor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_2026
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pozhnadzor']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pozhnadzor_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_secure_pass_2026@db:5432/pozhnadzor
      JWT_SECRET_KEY: super-secret-jwt-key-for-pozhnadzor-2026-nstu
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: '["*"]'
      SMTP_HOST: smtp.yandex.ru
      SMTP_PORT: 465
      SMTP_SECURE: "true"
      SMTP_USER: Bykov8642@yandex.ru
      SMTP_PASS: dqabciwhhmekfxdr
      SMTP_FROM: '"ПожНадзор.pro Служба безопасности" <Bykov8642@yandex.ru>'
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    ports:
      - '8000:8000'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pozhnadzor_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - /opt/pozhnadzor/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/pozhnadzor/ssl:/etc/nginx/ssl:ro
    ports:
      - '443:443'
      - '80:80'

  db-backup:
    build:
      context: ./docker-backup
      dockerfile: Dockerfile
    container_name: pozhnadzor_db_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: pozhnadzor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_2026
      CRON_SCHEDULE: '0 3 * * *'
      BACKUP_KEEP_DAYS: 7
      BACKUP_ON_START: 'false'
      TZ: Europe/Moscow
    volumes:
      - ./backups:/backups

volumes:
  postgres_data:
